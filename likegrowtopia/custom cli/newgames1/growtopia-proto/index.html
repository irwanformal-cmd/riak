<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Growtopia Prototype</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0D1B2A; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
    #game { display: block; }
    #ui-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    /* Game-style hotbar: bottom center, dark, chunky */
    #hotbar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: auto; z-index: 20; padding: 8px; background: rgba(8,12,20,0.75); border: 2px solid #1F2A44; border-radius: 14px; box-shadow: 0 8px 32px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08); backdrop-filter: blur(4px); }
    .slot { width: 58px; height: 64px; background: linear-gradient(180deg, #1A2340 0%, #10172E 100%); border: 2px solid #2A3A5E; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 5px; color: #fff; text-align: center; position: relative; user-select: none; cursor: pointer; transition: transform 0.08s, box-shadow 0.08s; }
    .slot:hover { transform: translateY(-2px); }
    .slot.selected { border-color: #FFD700 !important; box-shadow: 0 0 16px #FFD700AA, inset 0 0 12px rgba(255,215,0,0.15) !important; transform: translateY(-3px) scale(1.06); }
    .slot .slot-icon { pointer-events: none; }
    .slot .item-name { pointer-events: none; }
    .slot .count { position: absolute; bottom: 2px; right: 6px; font-size: 12px; font-weight: 800; color: #FFD700; text-shadow: 1px 1px 2px #000, 0 0 4px #000; pointer-events: none; }
    /* Splice lab panel */
    #splice-panel { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(180deg, #161C3A, #0E1328); border: 2px solid #FFD700; border-radius: 16px; padding: 24px; display: none; flex-direction: column; align-items: center; gap: 14px; z-index: 30; pointer-events: auto; min-width: 320px; box-shadow: 0 0 40px rgba(255,215,0,0.35), 0 16px 64px rgba(0,0,0,0.7); }
    #splice-panel.open { display: flex; }
    .splice-inputs { display: flex; gap: 18px; align-items: center; }
    .splice-slot { width: 68px; height: 68px; background: rgba(0,0,0,0.55); border: 2px dashed #4A5A7E; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #778; font-size: 11px; position: relative; cursor: pointer; transition: border-color 0.1s; }
    .splice-slot:hover { border-color: #FFD700; }
    .splice-slot.filled { border-style: solid; border-color: #FFD700; color: #fff; box-shadow: 0 0 12px rgba(255,215,0,0.4); }
    .splice-slot .slot-label { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; color: #AAB; letter-spacing: 0.5px; }
    #splice-btn { padding: 12px 36px; background: linear-gradient(180deg, #FFE066, #DAA520); border: none; border-bottom: 3px solid #8B6914; border-radius: 10px; color: #1A1408; font-weight: 800; font-size: 15px; letter-spacing: 1px; cursor: pointer; transition: transform 0.08s; }
    #splice-btn:hover:not(:disabled) { transform: translateY(-1px) scale(1.03); }
    #splice-btn:active:not(:disabled) { transform: translateY(1px); border-bottom-width: 1px; }
    #splice-btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.5); }
    #splice-result { min-height: 24px; color: #FFD700; font-size: 13px; font-weight: 600; text-align: center; }
    #close-splice { position: absolute; top: 10px; right: 14px; background: none; border: none; color: #778; font-size: 20px; cursor: pointer; }
    #close-splice:hover { color: #FFF; }
    /* Discovery toasts (top center) */
    #discovery-log { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 15; pointer-events: none; }
    .discovery-toast { background: linear-gradient(90deg, #FFD700, #FF8C00); color: #1A1408; padding: 10px 22px; border-radius: 10px; font-weight: 700; font-size: 13px; margin-bottom: 8px; box-shadow: 0 4px 20px rgba(255,215,0,0.45), 0 2px 0 #8B6914; animation: toastIn 0.25s ease, toastOut 0.4s ease 3s forwards; white-space: nowrap; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-16px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toastOut { to { opacity: 0; transform: translateY(-12px) scale(0.95); } }
    /* Controls hint (bottom-left, subtle) */
    #controls-hint { position: fixed; bottom: 16px; left: 16px; color: rgba(255,255,255,0.45); font-size: 11px; line-height: 1.7; z-index: 10; pointer-events: none; text-shadow: 1px 1px 2px #000; }
    #controls-hint b { color: rgba(255,215,0,0.8); }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="ui-overlay">
    <div id="hotbar"></div>
    <div id="discovery-log"></div>
    <div id="controls-hint"><b>A/D</b> or <b>←/→</b> move &nbsp; <b>Space</b> jump &nbsp; <b>Click</b> break &nbsp; <b>Right-click</b> place &nbsp; <b>E</b> splice &nbsp; <b>1-0</b> hotbar</div>
  </div>
  <div id="splice-panel">
    <button id="close-splice">×</button>
    <h3 style="color:#FFD700;margin:0 0 6px;font-size:18px;letter-spacing:1px;">🧪 SPLICE LAB</h3>
    <div style="color:#8899BB;font-size:11px;margin-bottom:4px;">Click a slot, then click a seed in your hotbar</div>
    <div class="splice-inputs">
      <div class="splice-slot" id="splice-slot-a"><span class="slot-label">SEED A</span>?</div>
      <div style="color:#FFD700;font-size:26px;font-weight:800;">+</div>
      <div class="splice-slot" id="splice-slot-b"><span class="slot-label">SEED B</span>?</div>
    </div>
    <button id="splice-btn" disabled>SPLICE</button>
    <div id="splice-result"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
